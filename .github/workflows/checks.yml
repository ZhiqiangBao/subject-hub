name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: python scripts/test_backend.py
      - name: Start the site with disposable data and check both ports
        env:
          PYTHONPATH: backend
        run: |
          export SUBJECT_HUB_DATA="$(mktemp -d)"
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8090 > "$RUNNER_TEMP/subject-hub.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/subject-hub.log"' EXIT
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8090/api/health | python -c 'import json,sys; assert json.load(sys.stdin)["items"] > 0'
          curl -fsS http://127.0.0.1:8091/api/auth/status | python -c 'import json,sys; assert json.load(sys.stdin)["admin_site"]'
          curl -fsS http://127.0.0.1:8090/api/auth/status | python -c 'import json,sys; assert not json.load(sys.stdin)["admin_site"]'
          curl -fsS http://127.0.0.1:8090/login | grep -q 'id="app"'
